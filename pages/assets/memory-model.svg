<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
<defs><marker id="a7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A2A2A"/></marker></defs>
<rect x="2" y="2" width="756" height="296" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
<text x="380.0" y="36" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">감각이 들어와 잠깐 머물고, 주의를 받으면 다루어지고, 되새기면 오래 남는다</text>
<rect x="60" y="110" width="180" height="70" rx="9" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/>
<text x="150" y="142" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold">감각 기억</text>
<text x="150" y="164" text-anchor="middle" font-size="11.5" fill="#7A7268">약 1초, 순식간</text>
<rect x="290" y="110" width="180" height="70" rx="9" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/>
<text x="380" y="142" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold">단기·작업 기억</text>
<text x="380" y="164" text-anchor="middle" font-size="11.5" fill="#7A7268">7±2개 · 금방 사라짐</text>
<rect x="520" y="110" width="180" height="70" rx="9" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/>
<text x="610" y="142" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold">장기 기억</text>
<text x="610" y="164" text-anchor="middle" font-size="11.5" fill="#7A7268">거의 무한 · 오래</text>
<line x1="240" y1="138" x2="288" y2="138" stroke="#2A2A2A" stroke-width="1.8" marker-end="url(#a7)"/>
<text x="264" y="128" text-anchor="middle" font-size="11" fill="#B5651D">주의</text>
<line x1="470" y1="138" x2="518" y2="138" stroke="#2A2A2A" stroke-width="1.8" marker-end="url(#a7)"/>
<text x="494" y="128" text-anchor="middle" font-size="11" fill="#B5651D">되새김</text>
<line x1="518" y1="158" x2="470" y2="158" stroke="#7A7268" stroke-width="1.3" marker-end="url(#a7)"/><text x="494" y="174" text-anchor="middle" font-size="10.5" fill="#7A7268">인출</text>
<text x="380" y="220" text-anchor="middle" font-size="12.5" fill="#2A2A2A">좁은 작업 기억은 <tspan fill="#B5651D" font-weight="bold">묶음(청킹)</tspan>으로 한계를 넘는다 — '바''다' → '바다'</text>
<text x="380" y="252" text-anchor="middle" font-size="12" fill="#7A7268">학습 = 연결의 변화(헵: 함께 발화하면 함께 연결된다) → 신경망 가중치의 뿌리</text>
</svg>