<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
<rect x="2" y="2" width="716" height="336" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
<text x="360.0" y="40" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">한정된 배낭에, 단위 무게당 가치가 큰 것부터 담는다 — 그것이 그리디</text>
<path d="M120,150 q-14,0 -14,16 l0,120 q0,16 16,16 l96,0 q16,0 16,-16 l0,-120 q0,-16 -14,-16 z" fill="#F3E7D6" stroke="#2A2A2A" stroke-width="1.6"/>
<path d="M140,150 q22,-34 56,0" fill="none" stroke="#2A2A2A" stroke-width="1.6"/>
<text x="172" y="300" text-anchor="middle" font-size="13" fill="#2A2A2A">배낭(용량 한정)</text>
<rect x="300" y="90" width="300" height="54" rx="8" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.4"/>
<circle cx="328" cy="117" r="16" fill="#B5651D"/><text x="328" y="122" text-anchor="middle" font-size="14" fill="#fff">A</text>
<text x="356" y="114" font-size="13" fill="#2A2A2A">가치 60 / 무게 10</text>
<text x="356" y="134" font-size="12" fill="#7A7268">무게당 가치 → 6</text>
<rect x="300" y="162" width="300" height="54" rx="8" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.4"/>
<circle cx="328" cy="189" r="16" fill="#3B6EA5"/><text x="328" y="194" text-anchor="middle" font-size="14" fill="#fff">B</text>
