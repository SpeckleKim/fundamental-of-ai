<rect x="55.0" y="270" width="130" height="34" rx="8" fill="#FFFFFF" stroke="#B5651D" stroke-width="1.5"/><text x="120" y="292" text-anchor="middle" font-size="11.5" fill="#2A2A2A" font-weight="bold">X = 캐럴 ✓</text>
<rect x="370.0" y="270" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#B5651D" stroke-width="1.5"/><text x="440" y="292" text-anchor="middle" font-size="11.5" fill="#2A2A2A" font-weight="bold">X = 데이브 ✓</text>
