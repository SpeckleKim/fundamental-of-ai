<rect x="240.0" y="200" width="120" height="34" rx="8" fill="#F3DADE" stroke="#B5495B" stroke-width="1.5"/><text x="300" y="222" text-anchor="middle" font-size="11.5" fill="#2A2A2A" font-weight="bold">막다른 길</text>
