<rect x="305.0" y="130" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.5"/><text x="380" y="152" text-anchor="middle" font-size="11.5" fill="#2A2A2A" font-weight="bold">부모(톰,앤)?</text>
