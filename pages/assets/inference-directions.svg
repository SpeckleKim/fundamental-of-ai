<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A2A2A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5495B"/></marker></defs>
<rect x="2" y="2" width="756" height="326" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
<text x="380.0" y="34" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">같은 재료(규칙·사례·결과)를 어느 방향으로 잇느냐 — 연역·귀납·가추</text>
<rect x="24" y="66" width="226" height="200" rx="8" fill="#FFFFFF" stroke="#B5651D" stroke-width="1.8"/><text x="137" y="171" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold"></text>
<text x="137" y="92" text-anchor="middle" font-size="13.5" fill="#B5651D" font-weight="bold">연역 (deduction)</text>
<text x="137" y="128" text-anchor="middle" font-size="11.5" fill="#2A2A2A">규칙: 사람은 죽는다</text>
<text x="137" y="152" text-anchor="middle" font-size="11.5" fill="#2A2A2A">사실: 소크라테스는 사람</text>
<line x1="137" y1="164" x2="137" y2="192" stroke="#B5651D" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="137" y="214" text-anchor="middle" font-size="11.5" fill="#B5651D" font-weight="bold">∴ 소크라테스는 죽는다</text>
<text x="137" y="248" text-anchor="middle" font-size="11" fill="#7A7268">확실 ↓ 좁혀 감</text>
<rect x="262" y="66" width="226" height="200" rx="8" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/><text x="375" y="171" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold"></text>
<text x="375" y="92" text-anchor="middle" font-size="13.5" fill="#3B6EA5" font-weight="bold">귀납 (induction)</text>
<text x="375" y="128" text-anchor="middle" font-size="11.5" fill="#2A2A2A">백조1 희다 · 백조2 희다 …</text>
<text x="375" y="152" text-anchor="middle" font-size="11.5" fill="#2A2A2A">수많은 사례</text>
<line x1="375" y1="164" x2="375" y2="192" stroke="#3B6EA5" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="375" y="214" text-anchor="middle" font-size="11.5" fill="#3B6EA5" font-weight="bold">∴ 백조는 (아마) 희다</text>
<text x="375" y="248" text-anchor="middle" font-size="11" fill="#7A7268">사례 ↑ 일반화</text>
<rect x="500" y="66" width="226" height="200" rx="8" fill="#FFFFFF" stroke="#4E7A51" stroke-width="1.8"/><text x="613" y="171" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold"></text>
<text x="613" y="92" text-anchor="middle" font-size="13.5" fill="#4E7A51" font-weight="bold">가추 (abduction)</text>
<text x="613" y="128" text-anchor="middle" font-size="11.5" fill="#2A2A2A">결과: 땅이 젖었다</text>
<text x="613" y="152" text-anchor="middle" font-size="11.5" fill="#2A2A2A">규칙: 비 오면 젖는다</text>
<line x1="613" y1="164" x2="613" y2="192" stroke="#4E7A51" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="613" y="214" text-anchor="middle" font-size="11.5" fill="#4E7A51" font-weight="bold">∴ (아마) 비가 왔다</text>
<text x="613" y="248" text-anchor="middle" font-size="11" fill="#7A7268">결과 ↩ 원인 추측</text>
<text x="380.0" y="318" text-anchor="middle" font-size="11" fill="#7A7268">연역만 '반드시 참'이고, 귀납·가추는 '그럴듯함' — 새 지식을 얻는 대신 틀릴 수 있다</text>
</svg>