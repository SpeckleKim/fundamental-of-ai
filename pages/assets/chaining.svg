<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A2A2A"/></marker></defs>
<rect x="2" y="2" width="756" height="296" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
<text x="380.0" y="34" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">같은 규칙망을 두 방향으로 — 사실에서 앞으로(전향), 목표에서 거슬러(후향)</text>
<rect x="40" y="70" width="300" height="200" rx="8" fill="#F7F2E8" stroke="#B5651D" stroke-width="1.6"/><text x="190" y="175" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold"></text>
<text x="190" y="96" text-anchor="middle" font-size="14" fill="#B5651D" font-weight="bold">전향 추론 (자료 주도)</text>
<rect x="70" y="116" width="110" height="34" rx="8" fill="#F3E7D6" stroke="#2A2A2A" stroke-width="1.6"/><text x="125" y="138" text-anchor="middle" font-size="12" fill="#2A2A2A" font-weight="bold">사실</text>
<rect x="70" y="164" width="110" height="34" rx="8" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/><text x="125" y="186" text-anchor="middle" font-size="12" fill="#2A2A2A" font-weight="bold">규칙 적용</text>
<rect x="70" y="212" width="110" height="34" rx="8" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/><text x="125" y="234" text-anchor="middle" font-size="12" fill="#2A2A2A" font-weight="bold">새 사실…</text>
<line x1="125" y1="150" x2="125" y2="164" stroke="#2A2A2A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="125" y1="198" x2="125" y2="212" stroke="#2A2A2A" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="250" y="180" text-anchor="middle" font-size="11.5" fill="#7A7268">아는 것에서</text>
<text x="250" y="198" text-anchor="middle" font-size="11.5" fill="#7A7268">결론으로 →</text>
<rect x="420" y="70" width="300" height="200" rx="8" fill="#EAF1EA" stroke="#4E7A51" stroke-width="1.6"/><text x="570" y="175" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold"></text>
<text x="570" y="96" text-anchor="middle" font-size="14" fill="#4E7A51" font-weight="bold">후향 추론 (목표 주도)</text>
<rect x="580" y="116" width="110" height="34" rx="8" fill="#DDEBDD" stroke="#2A2A2A" stroke-width="1.6"/><text x="635" y="138" text-anchor="middle" font-size="12" fill="#2A2A2A" font-weight="bold">목표</text>
<rect x="580" y="164" width="110" height="34" rx="8" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/><text x="635" y="186" text-anchor="middle" font-size="12" fill="#2A2A2A" font-weight="bold">필요 조건</text>
<rect x="580" y="212" width="110" height="34" rx="8" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/><text x="635" y="234" text-anchor="middle" font-size="12" fill="#2A2A2A" font-weight="bold">사실로 확인</text>
<line x1="635" y1="150" x2="635" y2="164" stroke="#2A2A2A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="635" y1="198" x2="635" y2="212" stroke="#2A2A2A" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="500" y="180" text-anchor="middle" font-size="11.5" fill="#7A7268">← 묻고 싶은</text>
<text x="500" y="198" text-anchor="middle" font-size="11.5" fill="#7A7268">것에서 거꾸로</text>
<text x="380.0" y="286" text-anchor="middle" font-size="11.5" fill="#7A7268">진단(증상→병)은 후향이, 모니터링(센서→경보)은 전향이 어울린다</text>
</svg>