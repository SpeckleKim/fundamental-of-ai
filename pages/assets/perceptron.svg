<text x="380.0" y="248" text-anchor="middle" font-size="12" fill="#7A7268">학습 = 답이 틀리면 가중치 w를 조금씩 고쳐 문턱을 다시 맞추는 일</text>
<text x="380.0" y="270" text-anchor="middle" font-size="11.5" fill="#7A7268">한계: 직선 하나로 가르는 것만 가능 — XOR는 풀지 못한다</text>
