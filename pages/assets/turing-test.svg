<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
  <defs>
    <marker id="tt" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A7268"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="756" height="326" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
  <text x="380" y="36" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">문자로만 대화해 누가 기계인지 가려낸다 — 못 가려내면 기계는 통과</text>

  <!-- 질문자 -->
  <circle cx="120" cy="150" r="20" fill="#F3E7D6" stroke="#2A2A2A" stroke-width="1.6"/>
  <path d="M98,210 q22,-40 44,0 z" fill="#F3E7D6" stroke="#2A2A2A" stroke-width="1.6"/>
  <text x="120" y="236" text-anchor="middle" font-size="13" fill="#2A2A2A">질문자</text>
  <text x="120" y="120" text-anchor="middle" font-size="20" fill="#B5651D">?</text>

  <!-- 칸막이 -->
  <line x1="400" y1="60" x2="400" y2="280" stroke="#2A2A2A" stroke-width="2.4" stroke-dasharray="2 6"/>
  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#7A7268">칸막이</text>

  <!-- 대화선 -->
  <line x1="150" y1="140" x2="560" y2="110" stroke="#7A7268" stroke-width="1.5" marker-start="url(#tt)" marker-end="url(#tt)"/>
  <line x1="150" y1="165" x2="560" y2="225" stroke="#7A7268" stroke-width="1.5" marker-start="url(#tt)" marker-end="url(#tt)"/>
  <text x="300" y="120" text-anchor="middle" font-size="11" fill="#7A7268">문자 대화</text>

  <!-- 사람 -->
  <circle cx="600" cy="100" r="18" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/>
  <path d="M580,152 q20,-36 40,0 z" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/>
  <text x="660" y="105" font-size="13" fill="#3B6EA5">사람</text>

  <!-- 기계 -->
  <rect x="582" y="200" width="36" height="34" rx="4" fill="#E9EEF5" stroke="#2A2A2A" stroke-width="1.6"/>
  <circle cx="592" cy="214" r="2.4" fill="#2A2A2A"/><circle cx="608" cy="214" r="2.4" fill="#2A2A2A"/>
  <line x1="592" y1="226" x2="608" y2="226" stroke="#2A2A2A" stroke-width="1.4"/>
  <text x="660" y="222" font-size="13" fill="#B5651D">기계</text>

  <text x="600" y="270" text-anchor="middle" font-size="12" fill="#2A2A2A">둘 중 누가 기계?</text>
</svg>
