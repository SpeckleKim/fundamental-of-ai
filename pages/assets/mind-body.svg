<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
<rect x="2" y="2" width="756" height="296" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
<text x="380.0" y="36" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">마음과 물질의 관계 — 기계가 마음을 가질 수 있는가?</text>
<rect x="40" y="70" width="216" height="170" rx="10" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/>
<text x="148.0" y="104" text-anchor="middle" font-size="15" fill="#2A2A2A" font-weight="bold">이원론</text>
<text x="148.0" y="132" text-anchor="middle" font-size="13" fill="#2A2A2A">마음 ≠ 물질</text>
<text x="148.0" y="154" text-anchor="middle" font-size="11.5" fill="#7A7268">(별개의 실체)</text>
<text x="56" y="190" font-size="12.5" fill="#2A2A2A">→ 기계는 마음을</text>
<text x="56" y="210" font-size="12.5" fill="#2A2A2A">   가질 수 없다</text>
<rect x="274" y="70" width="216" height="170" rx="10" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/>
<text x="382.0" y="104" text-anchor="middle" font-size="15" fill="#2A2A2A" font-weight="bold">유물론</text>
<text x="382.0" y="132" text-anchor="middle" font-size="13" fill="#2A2A2A">마음 = 물리 과정</text>
<text x="382.0" y="154" text-anchor="middle" font-size="11.5" fill="#7A7268">(뇌에서 일어나는 일)</text>
<text x="290" y="190" font-size="12.5" fill="#2A2A2A">→ 기계도 가질</text>
<text x="290" y="210" font-size="12.5" fill="#2A2A2A">   여지가 있다</text>
<rect x="508" y="70" width="216" height="170" rx="10" fill="#F3E7D6" stroke="#B5651D" stroke-width="2"/>
<text x="616.0" y="104" text-anchor="middle" font-size="15" fill="#2A2A2A" font-weight="bold">기능주의</text>
<text x="616.0" y="132" text-anchor="middle" font-size="13" fill="#B5651D">마음 = 기능적 역할</text>
<text x="616.0" y="154" text-anchor="middle" font-size="11.5" fill="#7A7268">(무엇으로 만들었든)</text>
<text x="524" y="190" font-size="12.5" fill="#2A2A2A">→ 강한 AI의</text>
<text x="524" y="210" font-size="12.5" fill="#2A2A2A">   철학적 토대</text>
</svg>