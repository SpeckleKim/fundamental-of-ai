<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
  <defs>
    <marker id="cr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A2A2A"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="756" height="356" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>

  <!-- 방 -->
  <rect x="238" y="92" width="286" height="190" rx="10" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="2"/>
  <text x="381" y="116" text-anchor="middle" font-size="13" fill="#7A7268">방 = 프로그램</text>

  <!-- 사람 -->
  <circle cx="300" cy="168" r="15" fill="#F3E7D6" stroke="#2A2A2A" stroke-width="1.6"/>
  <path d="M285,222 q15,-34 30,0 z" fill="#F3E7D6" stroke="#2A2A2A" stroke-width="1.6"/>
  <text x="300" y="250" text-anchor="middle" font-size="12" fill="#2A2A2A">사람</text>
  <text x="300" y="266" text-anchor="middle" font-size="11" fill="#B5651D">중국어 모름</text>

  <!-- 규칙책 -->
  <rect x="372" y="150" width="118" height="58" rx="6" fill="#E9EEF5" stroke="#2A2A2A" stroke-width="1.4"/>
  <text x="431" y="174" text-anchor="middle" font-size="12" fill="#2A2A2A">규칙책</text>
  <text x="431" y="192" text-anchor="middle" font-size="11" fill="#7A7268">기호 짝맞춤</text>

  <!-- 입력 -->
  <rect x="44" y="150" width="86" height="44" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.4"/>
  <text x="87" y="178" text-anchor="middle" font-size="17" fill="#2A2A2A">中文 ?</text>
  <text x="87" y="214" text-anchor="middle" font-size="12" fill="#B5651D">중국어 질문</text>
  <line x1="134" y1="172" x2="234" y2="172" stroke="#2A2A2A" stroke-width="2" marker-end="url(#cr)"/>

  <!-- 출력 -->
  <line x1="528" y1="230" x2="612" y2="230" stroke="#2A2A2A" stroke-width="2" marker-end="url(#cr)"/>
  <rect x="616" y="208" width="96" height="44" rx="6" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.4"/>
  <text x="664" y="236" text-anchor="middle" font-size="16" fill="#2A2A2A">中文 答</text>
  <text x="664" y="272" text-anchor="middle" font-size="12" fill="#3B6EA5">완벽한 답</text>

  <!-- 관찰자 -->
  <circle cx="664" cy="96" r="13" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.4"/>
  <text x="664" y="132" text-anchor="middle" font-size="11" fill="#7A7268">밖에서 보면</text>
  <text x="664" y="148" text-anchor="middle" font-size="12" fill="#2A2A2A">"이해하는 듯?"</text>

  <!-- 핵심 메시지 -->
  <text x="300" y="322" text-anchor="middle" font-size="13" fill="#2A2A2A">기호(구문)만 조작할 뿐, 뜻(의미)은 방 안 어디에도 없다  — 존 설</text>
</svg>
