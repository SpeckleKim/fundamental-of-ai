<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A2A2A"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="716" height="356" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>

  <!-- 깊이 밴드 -->
  <rect x="14" y="48" width="692" height="84" rx="8" fill="#F3E7D6" opacity="0.5"/>
  <rect x="14" y="140" width="692" height="84" rx="8" fill="#E9EEF5" opacity="0.6"/>
  <rect x="14" y="232" width="692" height="84" rx="8" fill="#F3E7D6" opacity="0.35"/>
  <text x="30" y="94" font-size="11" fill="#7A7268">깊이 0</text>
  <text x="30" y="186" font-size="11" fill="#7A7268">깊이 1</text>
  <text x="30" y="278" font-size="11" fill="#7A7268">깊이 2</text>

  <!-- 간선 -->
  <g stroke="#2A2A2A" stroke-width="1.6">
    <line x1="360" y1="110" x2="250" y2="160" marker-end="url(#ah3)"/>
    <line x1="360" y1="110" x2="470" y2="160" marker-end="url(#ah3)"/>
    <line x1="250" y1="204" x2="170" y2="252" marker-end="url(#ah3)"/>
    <line x1="250" y1="204" x2="330" y2="252" marker-end="url(#ah3)"/>
    <line x1="470" y1="204" x2="410" y2="252" marker-end="url(#ah3)"/>
    <line x1="470" y1="204" x2="560" y2="252" marker-end="url(#ah3)"/>
  </g>

  <!-- 노드 (숫자 = 방문 순서) -->
  <g font-size="15" text-anchor="middle">
    <circle cx="360" cy="90" r="21" fill="#B5651D" stroke="#2A2A2A" stroke-width="1.6"/><text x="360" y="95" fill="#fff">1</text>
    <circle cx="250" cy="182" r="21" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/><text x="250" y="187" fill="#2A2A2A">2</text>
    <circle cx="470" cy="182" r="21" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/><text x="470" y="187" fill="#2A2A2A">3</text>
    <circle cx="170" cy="274" r="21" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/><text x="170" y="279" fill="#2A2A2A">4</text>
    <circle cx="330" cy="274" r="21" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/><text x="330" y="279" fill="#2A2A2A">5</text>
    <circle cx="410" cy="274" r="21" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/><text x="410" y="279" fill="#2A2A2A">6</text>
    <circle cx="560" cy="274" r="21" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/><text x="560" y="279" fill="#2A2A2A">7</text>
  </g>

  <!-- 범례 -->
  <text x="360" y="338" text-anchor="middle" font-size="12" fill="#2A2A2A">번호 = 방문 순서 — 같은 깊이를 모두 본 뒤에야 다음 깊이로 (큐: 먼저 발견 → 먼저 방문)</text>
</svg>
