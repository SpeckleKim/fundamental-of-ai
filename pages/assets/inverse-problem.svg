<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A2A2A"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5495B"/></marker></defs>
<rect x="2" y="2" width="756" height="316" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
<text x="380.0" y="34" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">3차원 세상이 2차원 그림으로 눌리며 정보가 사라진다 — 그걸 거꾸로 푸는 일</text>
<ellipse cx="120" cy="150" rx="34" ry="16" fill="none" stroke="#2A2A2A" stroke-width="1.6"/>
<path d="M86,150 L92,210 a28,10 0 0 0 56,0 L154,150" fill="#F3E7D6" stroke="#2A2A2A" stroke-width="1.6"/>
<ellipse cx="120" cy="150" rx="34" ry="16" fill="#FBF7EF" stroke="#2A2A2A" stroke-width="1.6"/>
<text x="120" y="244" text-anchor="middle" font-size="12" fill="#2A2A2A">3D 실제 물체</text>
<line x1="166" y1="170" x2="250" y2="170" stroke="#2A2A2A" stroke-width="2" marker-end="url(#ar)"/>
<text x="208" y="160" text-anchor="middle" font-size="11" fill="#7A7268">눈/카메라</text>
<rect x="262" y="120" width="96" height="100" rx="4" fill="#2b2b30" stroke="#2A2A2A"/>
<rect x="286" y="140" width="48" height="64" rx="3" fill="#9a9a9a"/>
<text x="310" y="244" text-anchor="middle" font-size="12" fill="#2A2A2A">2D 이미지(납작)</text>
<line x1="372" y1="170" x2="452" y2="170" stroke="#B5495B" stroke-width="2" marker-end="url(#arr)"/>
<text x="412" y="160" text-anchor="middle" font-size="11" fill="#B5495B">거꾸로?</text>
<ellipse cx="490" cy="135" rx="24" ry="10" fill="none" stroke="#7A7268" stroke-width="1.3"/>
<path d="M466,135 L470,200 a20,7 0 0 0 40,0 L514,135" fill="#FFFFFF" stroke="#7A7268" stroke-width="1.3"/>
<text x="490" y="222" text-anchor="middle" font-size="11" fill="#7A7268">컵?</text>
<ellipse cx="578" cy="135" rx="24" ry="10" fill="none" stroke="#7A7268" stroke-width="1.3"/>
<path d="M554,135 L558,200 a20,7 0 0 0 40,0 L602,135" fill="#FFFFFF" stroke="#7A7268" stroke-width="1.3"/>
<text x="578" y="222" text-anchor="middle" font-size="11" fill="#7A7268">원기둥?</text>
<ellipse cx="666" cy="135" rx="24" ry="10" fill="none" stroke="#7A7268" stroke-width="1.3"/>
<path d="M642,135 L646,200 a20,7 0 0 0 40,0 L690,135" fill="#FFFFFF" stroke="#7A7268" stroke-width="1.3"/>
<text x="666" y="222" text-anchor="middle" font-size="11" fill="#7A7268">물통?</text>
<text x="578" y="244" text-anchor="middle" font-size="12" fill="#B5495B" font-weight="bold">후보가 여럿!</text>
<text x="380.0" y="308" text-anchor="middle" font-size="11.5" fill="#7A7268">같은 2D 그림을 만들 수 있는 3D는 여럿 — 그래서 '보는 일'은 답이 하나로 정해지지 않는 역문제다</text>
</svg>