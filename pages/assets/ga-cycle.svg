<path d="M160,104 L160,128 L114,128 L114,150" fill="none" stroke="#2A2A2A" stroke-width="1.7" marker-end="url(#ar)"/>
<path d="M698,206 L698,250 L114,250 L114,206" fill="none" stroke="#B5651D" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<text x="380.0" y="244" text-anchor="middle" font-size="12" fill="#B5651D" font-style="italic">목표에 닿을 때까지 세대를 거듭 반복</text>
