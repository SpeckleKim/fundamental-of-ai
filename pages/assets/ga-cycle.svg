<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A2A2A"/></marker><marker id="arb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B6EA5"/></marker></defs>
<rect x="2" y="2" width="756" height="296" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
<text x="380.0" y="34" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">한 세대의 손놀림 — 평가·선택·교차·돌연변이를 돌고 또 돈다</text>
<rect x="60" y="64" width="200" height="40" rx="8" fill="#F3E7D6" stroke="#2A2A2A" stroke-width="1.6"/><text x="160" y="89" text-anchor="middle" font-size="12.5" fill="#2A2A2A" font-weight="bold">초기 개체군 (무작위)</text>
<rect x="50" y="150" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#B5651D" stroke-width="1.8"/><text x="114" y="183" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold"></text>
<text x="114" y="174" text-anchor="middle" font-size="13" fill="#2A2A2A" font-weight="bold">① 적합도 평가</text>
<text x="114" y="193" text-anchor="middle" font-size="10.5" fill="#7A7268">얼마나 잘났나</text>
<rect x="196" y="150" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#B5651D" stroke-width="1.8"/><text x="260" y="183" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold"></text>
<text x="260" y="174" text-anchor="middle" font-size="13" fill="#2A2A2A" font-weight="bold">② 선택</text>
<text x="260" y="193" text-anchor="middle" font-size="10.5" fill="#7A7268">잘난 것 고름</text>
<rect x="342" y="150" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#3B6EA5" stroke-width="1.8"/><text x="406" y="183" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold"></text>
<text x="406" y="174" text-anchor="middle" font-size="13" fill="#2A2A2A" font-weight="bold">③ 교차</text>
<text x="406" y="193" text-anchor="middle" font-size="10.5" fill="#7A7268">섞어 자식 생성</text>
<rect x="488" y="150" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#4E7A51" stroke-width="1.8"/><text x="552" y="183" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold"></text>
<text x="552" y="174" text-anchor="middle" font-size="13" fill="#2A2A2A" font-weight="bold">④ 돌연변이</text>
<text x="552" y="193" text-anchor="middle" font-size="10.5" fill="#7A7268">가끔 변형</text>
<rect x="634" y="150" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#7A7268" stroke-width="1.8"/><text x="698" y="183" text-anchor="middle" font-size="13.5" fill="#2A2A2A" font-weight="bold"></text>
<text x="698" y="174" text-anchor="middle" font-size="13" fill="#2A2A2A" font-weight="bold">새 세대</text>
<text x="698" y="193" text-anchor="middle" font-size="10.5" fill="#7A7268">→ 다음 세대</text>
<line x1="178" y1="178" x2="196" y2="178" stroke="#2A2A2A" stroke-width="1.7" marker-end="url(#ar)"/>
<line x1="324" y1="178" x2="342" y2="178" stroke="#2A2A2A" stroke-width="1.7" marker-end="url(#ar)"/>
<line x1="470" y1="178" x2="488" y2="178" stroke="#2A2A2A" stroke-width="1.7" marker-end="url(#ar)"/>
