<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A2A2A"/></marker></defs>
<rect x="2" y="2" width="756" height="296" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
<text x="380.0" y="34" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">리스트 (A B C)는 사실 '칸 두 개짜리 상자'가 줄줄이 이어진 것 — car·cdr로 집는다</text>
<rect x="70" y="130" width="92" height="44" rx="5" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/>
<line x1="116.0" y1="130" x2="116.0" y2="174" stroke="#2A2A2A" stroke-width="1.2"/>
<text x="93" y="122" text-anchor="middle" font-size="10.5" fill="#7A7268">car</text>
<text x="139" y="122" text-anchor="middle" font-size="10.5" fill="#7A7268">cdr</text>
<text x="93" y="158" text-anchor="middle" font-size="15" fill="#B5651D" font-weight="bold">A</text>
<circle cx="139" cy="152" r="3.5" fill="#2A2A2A"/>
<line x1="139" y1="152" x2="226" y2="152" stroke="#2A2A2A" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="226" y="130" width="92" height="44" rx="5" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/>
<line x1="272.0" y1="130" x2="272.0" y2="174" stroke="#2A2A2A" stroke-width="1.2"/>
<text x="249" y="122" text-anchor="middle" font-size="10.5" fill="#7A7268">car</text>
<text x="295" y="122" text-anchor="middle" font-size="10.5" fill="#7A7268">cdr</text>
<text x="249" y="158" text-anchor="middle" font-size="15" fill="#B5651D" font-weight="bold">B</text>
<circle cx="295" cy="152" r="3.5" fill="#2A2A2A"/>
<line x1="295" y1="152" x2="382" y2="152" stroke="#2A2A2A" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="382" y="130" width="92" height="44" rx="5" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="1.6"/>
<line x1="428.0" y1="130" x2="428.0" y2="174" stroke="#2A2A2A" stroke-width="1.2"/>
<text x="405" y="122" text-anchor="middle" font-size="10.5" fill="#7A7268">car</text>
<text x="451" y="122" text-anchor="middle" font-size="10.5" fill="#7A7268">cdr</text>
<text x="405" y="158" text-anchor="middle" font-size="15" fill="#B5651D" font-weight="bold">C</text>
<text x="451" y="157" text-anchor="middle" font-size="12" fill="#7A7268">nil</text>
<text x="70" y="100" font-size="13" fill="#2A2A2A" font-weight="bold">(A B C)</text>
<text x="380.0" y="222" text-anchor="middle" font-size="12.5" fill="#2A2A2A">(car L) = 첫 원소 <tspan fill="#B5651D" font-weight="bold">A</tspan>  ·  (cdr L) = 나머지 리스트 <tspan fill="#3B6EA5" font-weight="bold">(B C)</tspan></text>
<text x="380.0" y="278" text-anchor="middle" font-size="11.5" fill="#7A7268">이 단순한 구조 덕에 코드도 데이터도 모두 리스트 — 재귀로 자연스럽게 훑는다</text>
</svg>