<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A2A2A"/></marker><marker id="arb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B6EA5"/></marker></defs>
<rect x="2" y="2" width="756" height="326" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
<text x="380.0" y="34" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">각자 똑똑하게 자기 이익을 좇은 끝에, 둘 다 더 나빠진다</text>
<text x="330" y="80" text-anchor="middle" font-size="12" fill="#2A2A2A" font-weight="bold">상대 부인(B)</text>
<text x="510" y="80" text-anchor="middle" font-size="12" fill="#2A2A2A" font-weight="bold">상대 자백(A)</text>
<text x="230" y="140" text-anchor="end" font-size="12" fill="#2A2A2A" font-weight="bold">내가 부인(B)</text>
<text x="230" y="230" text-anchor="end" font-size="12" fill="#2A2A2A" font-weight="bold">내가 자백(A)</text>
<rect x="240" y="90" width="180" height="90" fill="#EAF1EA" stroke="#4E7A51" stroke-width="2"/>
<text x="330" y="135" text-anchor="middle" font-size="18" fill="#2A2A2A" font-weight="bold">(0, 0)</text>
<text x="330" y="168" text-anchor="middle" font-size="11" fill="#4E7A51" font-weight="bold">파레토 최적(둘 다 부인)</text>
<rect x="420" y="90" width="180" height="90" fill="#FFFFFF" stroke="#7A7268" stroke-width="1.2"/>
<text x="510" y="135" text-anchor="middle" font-size="18" fill="#2A2A2A" font-weight="bold">(-2, +1)</text>
<rect x="240" y="180" width="180" height="90" fill="#FFFFFF" stroke="#7A7268" stroke-width="1.2"/>
<text x="330" y="225" text-anchor="middle" font-size="18" fill="#2A2A2A" font-weight="bold">(+1, -2)</text>
<rect x="420" y="180" width="180" height="90" fill="#F3DADE" stroke="#B5495B" stroke-width="2"/>
<text x="510" y="225" text-anchor="middle" font-size="18" fill="#2A2A2A" font-weight="bold">(-1, -1)</text>
<text x="510" y="258" text-anchor="middle" font-size="11" fill="#B5495B" font-weight="bold">내시 균형(안정·둘 다 자백)</text>
<text x="330" y="60" text-anchor="middle" font-size="10.5" fill="#7A7268">칸 = (나의 보수, 상대의 보수)</text>
<text x="380.0" y="314" text-anchor="middle" font-size="11.5" fill="#7A7268">안정적인 곳(내시)은 모두에게 최선이 아니고, 모두에게 최선인 곳(파레토)은 안정적이지 않다</text>
</svg>