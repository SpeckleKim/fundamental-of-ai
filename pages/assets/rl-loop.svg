<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Helvetica Neue', Arial, 'AppleSDGothicNeo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A2A2A"/></marker><marker id="arb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B6EA5"/></marker></defs>
<rect x="2" y="2" width="756" height="296" rx="14" fill="#FBF7EF" stroke="#E7DFCB"/>
<text x="380.0" y="34" text-anchor="middle" font-size="14" fill="#7A7268" font-style="italic">행동하고, 그 결과로 상태와 보상을 받고, 다시 행동한다 — 시행착오의 고리</text>
<rect x="120" y="110" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#B5651D" stroke-width="2"/><text x="215" y="155" text-anchor="middle" font-size="15" fill="#2A2A2A" font-weight="bold">에이전트</text>
<text x="215" y="170" text-anchor="middle" font-size="11" fill="#7A7268">무엇을 할지 정한다</text>
<rect x="450" y="110" width="190" height="80" rx="8" fill="#E9EEF5" stroke="#3B6EA5" stroke-width="2"/><text x="545" y="155" text-anchor="middle" font-size="15" fill="#2A2A2A" font-weight="bold">환경</text>
<text x="545" y="170" text-anchor="middle" font-size="11" fill="#7A7268">세상이 반응한다</text>
<path d="M310,135 L450,135" fill="none" stroke="#B5651D" stroke-width="2" marker-end="url(#ar)"/>
<text x="380" y="126" text-anchor="middle" font-size="12.5" fill="#B5651D" font-weight="bold">행동(action)</text>
<path d="M450,168 L310,168" fill="none" stroke="#3B6EA5" stroke-width="2" marker-end="url(#arb)"/>
<text x="380" y="186" text-anchor="middle" font-size="12.5" fill="#3B6EA5" font-weight="bold">상태(state) · 보상(reward)</text>
<text x="380.0" y="240" text-anchor="middle" font-size="12" fill="#2A2A2A">좋은 보상을 준 행동은 더 자주, 벌을 부른 행동은 덜 — 그렇게 '정책'이 다듬어진다</text>
<text x="380.0" y="284" text-anchor="middle" font-size="11.5" fill="#7A7268">정답을 알려 주는 선생은 없다. 오직 보상이라는 점수만이 길을 가리킨다(강아지 훈련처럼)</text>
</svg>